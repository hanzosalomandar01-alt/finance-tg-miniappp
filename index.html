<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Мини-приложение — макет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --card:           #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;
    --good-bg:        #e8f7e8;
    --critical:       #d03b3b;
    --critical-bg:    #fbeaea;
    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --tg-link:  #2a78d6;
    --nav-bg:   #ffffff;
    --chip-bg:  #f1f0ec;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --card:           #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --good:           #0ca30c;
    --good-bg:        rgba(12,163,12,0.16);
    --critical:       #e66767;
    --critical-bg:    rgba(230,103,103,0.16);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --tg-link:  #3987e5;
    --nav-bg:   #1f1f1e;
    --chip-bg:  #2c2c2a;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .caption { display: none; }

  .phone-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }

  .phone {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    background: var(--page-plane);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .notch { display: none; }

  /* Telegram-style top bar */
  .tg-header {
    background: var(--card);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--series-1), var(--series-3));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 14px;
    flex-shrink: 0;
  }
  .tg-header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
  .tg-header-sub { font-size: 12px; color: var(--good); line-height: 1.2; }
  .tg-header-actions { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .icon-btn { width: 22px; height: 22px; color: var(--text-secondary); }
  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text-secondary);
    font-size: 11px;
    border-radius: 20px;
    padding: 5px 10px;
    cursor: pointer;
  }

  /* Content */
  .tg-content {
    flex: 1;
    overflow-y: auto;
    background: var(--page-plane);
    padding: 14px 14px 90px;
  }
  .tg-content::-webkit-scrollbar { display: none; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 18px 4px 8px;
  }
  .section-title:first-child { margin-top: 2px; }

  .card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
  }

  /* Stat tiles */
  .stat-row { display: flex; gap: 8px; }
  .stat-tile {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .stat-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-value { font-size: 19px; font-weight: 600; color: var(--text-primary); font-variant-numeric: proportional-nums; }
  .stat-delta { font-size: 11.5px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
  .stat-delta.good { color: var(--good); }
  .stat-delta.bad { color: var(--critical); }

  /* Tasks */
  .task-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 12px;
    border-bottom: 1px solid var(--gridline);
  }
  .task-row:last-child { border-bottom: none; }
  .task-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--baseline);
    flex-shrink: 0; margin-top: 1px;
  }
  .task-check.done { background: var(--good); border-color: var(--good); position: relative; }
  .task-check.done::after {
    content: ""; position: absolute; left: 5px; top: 2px;
    width: 5px; height: 9px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(40deg);
  }
  .task-title { font-size: 14.5px; color: var(--text-primary); font-weight: 500; }
  .task-title.done { text-decoration: line-through; color: var(--text-muted); font-weight: 400; }
  .task-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip {
    font-size: 10.5px; padding: 2px 7px; border-radius: 8px;
    background: var(--chip-bg); color: var(--text-secondary);
  }
  .chip.urgent { background: var(--critical-bg); color: var(--critical); font-weight: 600; }

  /* Calendar */
  .week-strip { display: flex; justify-content: space-between; padding: 4px 2px 2px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .week-day .num {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--text-primary); font-weight: 500;
  }
  .week-day.today .num { background: var(--series-1); color: #fff; font-weight: 600; }
  .week-day .dots { display: flex; gap: 2px; height: 4px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; }

  .legend-row { display: flex; gap: 14px; padding: 10px 4px 2px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 8px; height: 8px; border-radius: 2px; }

  .event-day-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin: 16px 4px 6px; }
  .event-row { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--gridline); }
  .event-row:last-child { border-bottom: none; }
  .event-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .event-time { font-size: 11.5px; color: var(--text-muted); width: 44px; flex-shrink: 0; padding-top: 1px; }
  .event-title { font-size: 14px; color: var(--text-primary); font-weight: 500; }
  .event-loc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Finance bars */
  .bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .bar-label { width: 84px; flex-shrink: 0; font-size: 12.5px; color: var(--text-secondary); }
  .bar-track { flex: 1; height: 10px; background: var(--gridline); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .bar-value { width: 68px; flex-shrink: 0; text-align: right; font-size: 12.5px; color: var(--text-primary); font-variant-numeric: tabular-nums; }

  /* Transactions */
  .txn-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--gridline); }
  .txn-row:last-child { border-bottom: none; }
  .txn-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .txn-title { font-size: 13.5px; color: var(--text-primary); font-weight: 500; }
  .txn-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .txn-amount { margin-left: auto; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .txn-amount.plus { color: var(--good); }
  .txn-amount.minus { color: var(--text-primary); }

  .show-more { text-align: center; padding: 12px; font-size: 13px; color: var(--tg-link); font-weight: 500; }

  /* Bottom nav */
  .tab-bar {
    position: sticky; left: 0; right: 0; bottom: 0;
    background: var(--nav-bg);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 10px));
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10.5px;
  }
  .tab-item svg { width: 23px; height: 23px; }
  .tab-item.active { color: var(--series-1); }

  .view { display: none; }
  .view.active { display: block; }

</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <div class="notch"></div>

    <div class="tg-header">
      <div class="tg-avatar">А</div>
      <div>
        <div class="tg-header-title">Ассистент</div>
        <div class="tg-header-sub">на связи</div>
      </div>
      <div class="tg-header-actions">
        <button class="theme-toggle" onclick="toggleTheme()">🌓 тема</button>
      </div>
    </div>

    <div class="tg-content">

      <!-- ===== TASKS VIEW ===== -->
      <div class="view active" id="view-tasks">
        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label">Активных задач</div>
            <div class="stat-value" id="stat-tasks-active">–</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">Выполнено</div>
            <div class="stat-value" id="stat-tasks-done">–</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">Всего</div>
            <div class="stat-value" id="stat-tasks-total">–</div>
          </div>
        </div>

        <div class="section-title">Задачи</div>
        <div class="card" id="tasks-list">
          <div class="task-row"><div class="task-title" style="color:var(--text-muted)">Загрузка…</div></div>
        </div>
      </div>

      <!-- ===== CALENDAR VIEW ===== -->
      <div class="view" id="view-calendar">
        <div class="section-title">Ближайшие события</div>
        <div class="card" id="events-list">
          <div class="event-row"><div class="event-title" style="color:var(--text-muted)">Загрузка…</div></div>
        </div>
      </div>

      <!-- ===== FINANCE VIEW ===== -->
      <div class="view" id="view-finance">
        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label" id="finance-month-label">Баланс</div>
            <div class="stat-value" id="stat-finance-balance">–</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">Доходы</div>
            <div class="stat-value" id="stat-finance-income">–</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">Расходы</div>
            <div class="stat-value" id="stat-finance-expense">–</div>
          </div>
        </div>

        <div class="section-title">Соотношение доход / расход</div>
        <div class="card" id="finance-bars">
          <div class="bar-row"><div class="bar-label" style="color:var(--text-muted)">Загрузка…</div></div>
        </div>
      </div>

    </div>

    <div class="tab-bar">
      <div class="tab-item active" data-tab="tasks" onclick="showTab('tasks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12l2.5 2.5L16 9"></path></svg>
        Задачи
      </div>
      <div class="tab-item" data-tab="calendar" onclick="showTab('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        Календарь
      </div>
      <div class="tab-item" data-tab="finance" onclick="showTab('finance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path><circle cx="16" cy="14" r="1.4" fill="currentColor" stroke="none"></circle></svg>
        Финансы
      </div>
    </div>
  </div>
  <div class="caption">Задачи · Календарь · Финансы — нажмите на вкладку внизу. Кнопка «🌓 тема» переключает светлую/тёмную схему.</div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
  }

  function showTab(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab-item[data-tab="' + name + '"]').classList.add('active');
  }

  let dark = false;
  function toggleTheme() {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }

  // ===== Загрузка реальных данных из n8n webhook =====
  const DASHBOARD_URL = 'https://hanzo17.app.n8n.cloud/webhook/dashboard';

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatMoney(n) {
    if (typeof n !== 'number' || isNaN(n)) return '–';
    return n.toLocaleString('ru-RU');
  }

  function formatEventTime(dt) {
    if (!dt) return '';
    const d = new Date(dt);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function renderTasks(tasks) {
    const list = document.getElementById('tasks-list');
    const items = Array.isArray(tasks) ? tasks : [];

    const active = items.filter(t => t.status !== 'completed');
    const done = items.filter(t => t.status === 'completed');

    document.getElementById('stat-tasks-active').textContent = active.length;
    document.getElementById('stat-tasks-done').textContent = done.length;
    document.getElementById('stat-tasks-total').textContent = items.length;

    if (!items.length) {
      list.innerHTML = '<div class="task-row"><div class="task-title" style="color:var(--text-muted)">Задач пока нет</div></div>';
      return;
    }

    list.innerHTML = items.map(t => {
      const isDone = t.status === 'completed';
      return `
        <div class="task-row">
          <div class="task-check${isDone ? ' done' : ''}"></div>
          <div>
            <div class="task-title${isDone ? ' done' : ''}">${escapeHtml(t.title || 'Без названия')}</div>
            ${t.due ? `<div class="task-meta"><span>· ${escapeHtml(formatEventTime(t.due))}</span></div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderEvents(events) {
    const list = document.getElementById('events-list');
    const items = Array.isArray(events) ? events : [];

    if (!items.length) {
      list.innerHTML = '<div class="event-row"><div class="event-title" style="color:var(--text-muted)">Событий не найдено</div></div>';
      return;
    }

    list.innerHTML = items.map(e => {
      const start = e.start && (e.start.dateTime || e.start.date);
      return `
        <div class="event-row">
          <div class="event-bar" style="background:var(--series-1)"></div>
          <div class="event-time">${escapeHtml(formatEventTime(start))}</div>
          <div>
            <div class="event-title">${escapeHtml(e.summary || 'Без названия')}</div>
            ${e.location ? `<div class="event-loc">${escapeHtml(e.location)}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderFinance(finance) {
    const f = finance || {};
    const income = typeof f.income === 'number' ? f.income : 0;
    const expense = typeof f.expense === 'number' ? f.expense : 0;
    const balance = typeof f.balance === 'number' ? f.balance : income - expense;

    document.getElementById('finance-month-label').textContent = f.month ? `Баланс, ${f.month}` : 'Баланс';
    document.getElementById('stat-finance-balance').textContent = formatMoney(balance);
    document.getElementById('stat-finance-income').textContent = formatMoney(income);
    document.getElementById('stat-finance-expense').textContent = formatMoney(expense);

    const max = Math.max(income, expense, 1);
    document.getElementById('finance-bars').innerHTML = `
      <div class="bar-row">
        <div class="bar-label">Доход</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(income / max * 100)}%;background:var(--good)"></div></div>
        <div class="bar-value">${formatMoney(income)}</div>
      </div>
      <div class="bar-row">
        <div class="bar-label">Расход</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(expense / max * 100)}%;background:var(--critical)"></div></div>
        <div class="bar-value">${formatMoney(expense)}</div>
      </div>`;
  }

  function showError(message) {
    const msg = `<div style="padding:14px;color:var(--critical);font-size:13px;">${escapeHtml(message)}</div>`;
    document.getElementById('tasks-list').innerHTML = msg;
    document.getElementById('events-list').innerHTML = msg;
    document.getElementById('finance-bars').innerHTML = msg;
  }

  async function loadDashboard() {
    try {
      const res = await fetch(DASHBOARD_URL, { method: 'GET' });
      if (!res.ok) throw new Error('Сервер ответил ошибкой ' + res.status);
      const data = await res.json();
      renderTasks(data.tasks);
      renderEvents(data.events);
      renderFinance(data.finance);
    } catch (err) {
      showError('Не удалось загрузить данные: ' + err.message);
    }
  }

  loadDashboard();
</script>

</body>
</html>
