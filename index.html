<title>Ритм</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============ TOKENS (light, blue accent — committed single theme) ============ */
  :root{
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #eaeef5;
    --border: #dce2ec;
    --border-soft: #e6eaf2;
    --ink: #16202e;
    --ink-dim: #5b6b80;
    --ink-faint: #93a1b5;
    --accent: #2a63e4;
    --accent-soft: #e1e9fb;
    --accent-ink: #ffffff;
    --income: #1f9d63;
    --income-bg: #def5e7;
    --expense: #d6483a;
    --expense-bg: #fbe4e1;
    --shadow: 0 1px 2px rgba(22,32,46,.06), 0 8px 24px -12px rgba(22,32,46,.16);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 18px;
    --font-display: 'Fraunces', ui-serif, Georgia, serif;
    --font-body: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  button{ font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .tabular{ font-variant-numeric:tabular-nums; }

  /* ============ SHELL ============ */
  .phone{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px 14px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    line-height:1.1;
    letter-spacing:.01em;
  }
  .brand-sub{
    font-size:11.5px;
    color:var(--ink-dim);
    text-transform:capitalize;
    margin-top:1px;
  }
  .topbar-stat{
    text-align:right;
    font-family:var(--font-mono);
    line-height:1.15;
  }
  .topbar-stat .num{ font-size:16px; font-weight:600; }
  .topbar-stat .lbl{
    font-family:var(--font-body);
    font-size:10.5px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .content{
    flex:1;
    padding:2px 18px 100px;
    overflow-x:hidden;
  }
  .view{ display:none; flex-direction:column; gap:16px; animation:fade .18s ease; }
  .view.active{ display:flex; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  h2.section-title{
    font-family:var(--font-display);
    font-weight:600;
    margin:2px 0 -6px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:11.5px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow);
  }

  /* ============ TAB BAR ============ */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:center;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:10px 0 0;
    z-index:30;
    pointer-events:none;
  }
  .tabbar-inner{
    pointer-events:auto;
    width:100%;
    max-width:460px;
    margin:0 18px;
    display:flex;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:6px;
    gap:4px;
    margin-bottom:14px;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 4px 7px;
    background:transparent;
    border:none;
    border-radius:11px;
    color:var(--ink-dim);
    transition:background .15s ease, color .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab span{ font-size:10.5px; font-weight:600; letter-spacing:.01em; }
  .tab.active{ background:var(--accent-soft); color:var(--accent); }

  /* ============ ICON BUTTON (calendar nav) ============ */
  .btn-icon{
    width:34px; height:34px; padding:0; flex:none;
    border-radius:10px;
    border:none;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .btn-icon svg{ width:15px; height:15px; }

  /* ============ CHIPS (filters — display only) ============ */
  .chip{
    border:1px solid var(--border);
    background:var(--surface-2);
    border-radius:999px;
    padding:6px 13px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-dim);
  }
  .chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chip-row{ display:flex; gap:7px; flex-wrap:wrap; }

  /* ============ TASKS ============ */
  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task{
    display:flex; align-items:flex-start; gap:10px;
    padding:12px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-m); box-shadow:var(--shadow);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .task:hover{ border-color:var(--accent); }
  .task.done{ opacity:.6; }
  .check{
    width:21px; height:21px; border-radius:50%; flex:none; margin-top:1px;
    border:2px solid var(--border); background:var(--surface-2); padding:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .12s ease, border-color .12s ease, transform .12s ease;
  }
  .check:hover{ border-color:var(--accent); }
  .check:active{ transform:scale(.9); }
  .task.done .check{ background:var(--income); border-color:var(--income); }
  .check svg{ width:11px; height:11px; stroke:var(--surface); display:none; }
  .task.done .check svg{ display:block; }
  .task-body{ flex:1; min-width:0; }
  .task-text{ font-size:14.5px; font-weight:500; line-height:1.35; }
  .task.done .task-text{ text-decoration:line-through; }
  .task-meta{ display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap; }
  .prio-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .prio-label{ font-size:11px; color:var(--ink-dim); font-weight:600; }
  .due-tag{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim);
    background:var(--surface-2); padding:2px 7px; border-radius:6px;
  }
  .due-tag.overdue{ color:var(--expense); background:var(--expense-bg); }

  .empty{
    text-align:center; padding:34px 10px; color:var(--ink-faint);
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .empty svg{ width:26px; height:26px; opacity:.5; }
  .empty span{ font-size:13px; }

  /* ============ CALENDAR ============ */
  .cal-card{ padding:14px; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-nav .month-label{ font-family:var(--font-display); font-weight:600; font-size:15px; text-transform:capitalize; }
  .cal-weekdays, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-weekdays div{ text-align:center; font-size:10px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; padding-bottom:6px; }
  .cal-day{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:13px; font-weight:600; color:var(--ink);
    font-family:var(--font-mono);
    background:transparent; border:none; padding:0;
  }
  .cal-day.out{ color:var(--ink-faint); font-weight:400; opacity:.5; }
  .cal-day.today{ box-shadow:inset 0 0 0 1.5px var(--accent); }
  .cal-day.selected{ background:var(--accent); color:var(--accent-ink); }
  .cal-day .dot{
    position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--accent);
  }
  .cal-day.selected .dot{ background:var(--accent-ink); }

  .day-events-head .date-label{ font-weight:700; font-size:13.5px; text-transform:capitalize; }
  .event-item{
    display:flex; gap:10px; padding:11px 12px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-m); box-shadow:var(--shadow); align-items:flex-start;
  }
  .event-time{
    font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); padding:4px 7px; border-radius:7px; flex:none; min-width:44px; text-align:center;
  }
  .event-body{ flex:1; min-width:0; }
  .event-title{ font-size:13.5px; font-weight:600; }
  .event-notes{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .upcoming-item{ display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--border-soft); }
  .upcoming-item:last-child{ border-bottom:none; }
  .upcoming-date{
    font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-dim);
    background:var(--surface-2); border-radius:7px; padding:5px 7px; text-align:center; flex:none; min-width:40px; line-height:1.1;
  }
  .upcoming-date b{ display:block; font-size:13px; color:var(--ink); }

  /* ============ FINANCE ============ */
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-card{ padding:12px 10px; text-align:left; }
  .stat-card .lbl{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .stat-card .val{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; margin-top:4px; word-break:break-word; }
  .stat-card.income .val{ color:var(--income); }
  .stat-card.expense .val{ color:var(--expense); }

  .bars{ display:flex; flex-direction:column; gap:10px; }
  .bar-row .bar-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .bar-row .bar-top b{ font-weight:600; }
  .bar-row .bar-top .amt{ font-family:var(--font-mono); color:var(--ink-dim); }
  .bar-track{ height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:var(--accent); }

  .tx-group-label{ font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin:4px 0 -4px; }
  .tx-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); box-shadow:var(--shadow); }
  .tx-badge{ width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .tx-badge.income{ background:var(--income-bg); color:var(--income); }
  .tx-badge.expense{ background:var(--expense-bg); color:var(--expense); }
  .tx-body{ flex:1; min-width:0; }
  .tx-cat{ font-size:13.5px; font-weight:600; }
  .tx-note{ font-size:11.5px; color:var(--ink-dim); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-amt{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; flex:none; }
  .tx-amt.income{ color:var(--income); }
  .tx-amt.expense{ color:var(--expense); }

  @media (prefers-reduced-motion: reduce){
    .view{ animation:none !important; }
  }

  /* ---------- итоги из Свода (added) ---------- */
  .fin-label{ font-size:12px; color:#7f97b3; letter-spacing:.02em; margin:0 0 12px 2px; }

  /* ---------- sync indicator (added) ---------- */
  .topbar-right{ display:flex; align-items:center; }
  .sync-row{ display:flex; align-items:center; gap:5px; margin-top:2px; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:#8a9bb0; flex:none; transition:background .2s; }
  .sync-dot.load{ background:#2a63e4; animation:syncPulse .9s ease-in-out infinite; }
  .sync-dot.ok{ background:#2fa36b; }
  .sync-dot.err{ background:#d6483a; }
  @keyframes syncPulse{ 0%,100%{opacity:1} 50%{opacity:.2} }
  .sync-txt{ font-size:11px; color:#8a9bb0; }
  .refresh-btn{ -webkit-appearance:none; appearance:none; border:0; background:transparent; padding:7px; margin:-7px -5px -7px 4px; cursor:pointer; color:#7f97b3; line-height:0; border-radius:10px; }
  .refresh-btn:active{ background:rgba(127,151,179,.14); }
  .refresh-btn svg{ width:17px; height:17px; }
  .refresh-btn.spin svg{ animation:ritmSpin .8s linear infinite; }
  @keyframes ritmSpin{ to{ transform:rotate(360deg) } }
  @media (prefers-reduced-motion: reduce){
    .sync-dot.load, .refresh-btn.spin svg{ animation:none !important; }
  }
</style>

<div class="phone">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg>
      </div>
      <div>
        <div class="brand-name">Ритм</div>
        <div class="brand-sub" id="todayLabel"></div>
        <div class="sync-row"><span class="sync-dot" id="syncDot"></span><span class="sync-txt" id="syncTxt">—</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-stat" id="topStat"></div>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main class="content" id="content">

    <!-- ================= TASKS ================= -->
    <section class="view" id="view-tasks">
      <div class="chip-row" id="taskFilters"></div>
      <div class="task-list" id="taskList"></div>
    </section>

    <!-- ================= CALENDAR ================= -->
    <section class="view" id="view-calendar">
      <div class="card cal-card">
        <div class="cal-nav">
          <button class="btn-icon" id="calPrev" aria-label="Предыдущий месяц">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="month-label" id="calMonthLabel"></div>
          <button class="btn-icon" id="calNext" aria-label="Следующий месяц">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="day-events-head">
        <div class="date-label" id="selectedDayLabel"></div>
      </div>
      <div class="task-list" id="dayEventsList"></div>

      <h2 class="section-title">Ближайшие события</h2>
      <div class="card" id="upcomingList" style="padding:4px 12px;"></div>
    </section>

    <!-- ================= FINANCE ================= -->
    <section class="view" id="view-finance">
      <div class="chip-row" id="finPeriods"></div>
      <div class="fin-label" id="finLabel" style="display:none"></div>

      <div class="stat-row">
        <div class="card stat-card income"><div class="lbl">Доходы</div><div class="val tabular" id="statIncome"></div></div>
        <div class="card stat-card expense"><div class="lbl">Расходы</div><div class="val tabular" id="statExpense"></div></div>
        <div class="card stat-card"><div class="lbl">Баланс</div><div class="val tabular" id="statBalance"></div></div>
      </div>

      <div id="breakdownWrap">
        <h2 class="section-title">Расходы по категориям</h2>
        <div class="card bars" id="catBars" style="padding:14px;"></div>
      </div>

      <div id="txWrap">
        <h2 class="section-title">Операции</h2>
        <div class="task-list" id="txList"></div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span>Задачи</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Календарь</span>
      </button>
      <button class="tab" data-tab="finance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg>
        <span>Финансы</span>
      </button>
    </div>
  </nav>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Telegram WebApp bridge (safe no-op outside Telegram) ---------- */
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  function haptic(kind){
    if (!tg || !tg.HapticFeedback) return;
    try{
      if (kind === 'success' || kind === 'error') tg.HapticFeedback.notificationOccurred(kind);
      else tg.HapticFeedback.impactOccurred(kind || 'light');
    }catch(e){}
  }

  /* ---------- Constants ---------- */
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var WEEKDAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  var PRIO = { low:{c:'#7f97b3', l:'Низкий'}, med:{c:'#2a63e4', l:'Средний'}, high:{c:'#d6483a', l:'Высокий'} };

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function todayISO(){ return fmtISO(new Date()); }
  function fmtISO(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function money(n){ return Math.round(n*100)/100; }
  function fmtMoney(n){
    var v = money(n);
    return (v<0?'−':'') + Math.abs(v).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' смн.';
  }

  /* ---------- Seed / stored data (display only — no editing UI) ---------- */
  function seedState(){
    var t = todayISO();
    var d = new Date();
    var plus = function(n){ var x=new Date(d); x.setDate(x.getDate()+n); return fmtISO(x); };
    return {
      tasks: [
        { id: uid(), text:'Отправить отчёт клиенту', done:false, priority:'high', due:t },
        { id: uid(), text:'Записаться к стоматологу', done:false, priority:'med', due:plus(2) },
        { id: uid(), text:'Купить корм для кота', done:false, priority:'low', due:null },
        { id: uid(), text:'Оплатить интернет', done:true, priority:'med', due:plus(-1) }
      ],
      events: [
        { id: uid(), title:'Созвон с командой', date:t, time:'11:00', notes:'Обсудить релиз' },
        { id: uid(), title:'День рождения Алии', date:plus(3), time:'', notes:'Не забыть подарок' },
        { id: uid(), title:'Стоматолог', date:plus(2), time:'14:30', notes:'' },
        { id: uid(), title:'Тренировка', date:plus(1), time:'19:00', notes:'' }
      ],
      tx: [
        { id: uid(), type:'income', amount:4500, category:'Зарплата', date: plus(-5), note:'Аванс' },
        { id: uid(), type:'expense', amount:180, category:'Еда', date: plus(-1), note:'Продукты' },
        { id: uid(), type:'expense', amount:60, category:'Транспорт', date: t, note:'Такси' },
        { id: uid(), type:'expense', amount:1800, category:'Жильё', date: plus(-6), note:'Аренда' },
        { id: uid(), type:'expense', amount:150, category:'Развлечения', date: plus(-2), note:'Кино' },
        { id: uid(), type:'income', amount:900, category:'Фриланс', date: plus(-3), note:'Проект' },
        { id: uid(), type:'expense', amount:45, category:'Связь', date: plus(-4), note:'Мобильная связь' }
      ],
      ui: { tab:'tasks', taskFilter:'all', calYear: d.getFullYear(), calMonth: d.getMonth(), selectedDay: t, finPeriod:'month' }
    };
  }

  var STORE_KEY = 'ritm_state_v2';
  var CFG = window.RITM_CONFIG || {};
  var API_URL = String(CFG.apiUrl || '').trim();
  var API_TOKEN = String(CFG.apiToken || '');
  var FIN_SOURCE = (CFG.financeSource === 'transactions') ? 'transactions' : 'svod';

  function useTotals(){ return FIN_SOURCE === 'svod' && !!state.totals; }

  function emptyState(){ var s = seedState(); s.tasks = []; s.events = []; s.tx = []; return s; }

  var state;
  try{
    var raw = localStorage.getItem(STORE_KEY);
    state = raw ? JSON.parse(raw) : (API_URL ? emptyState() : seedState());
    if (!state.ui) state.ui = seedState().ui;
  }catch(e){ state = API_URL ? emptyState() : seedState(); }
  if (!Array.isArray(state.tasks))  state.tasks  = [];
  if (!Array.isArray(state.events)) state.events = [];
  if (!Array.isArray(state.tx))     state.tx     = [];
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}

  function saveUI(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

  /* ---------- Header ---------- */
  function renderHeader(){
    var d = new Date();
    document.getElementById('todayLabel').textContent = d.toLocaleDateString('ru-RU',{ weekday:'long', day:'numeric', month:'long' });
    var stat = document.getElementById('topStat');
    if (state.ui.tab === 'tasks'){
      var left = state.tasks.filter(function(t){return !t.done;}).length;
      stat.innerHTML = '<div class="num tabular">'+left+'</div><div class="lbl">активно</div>';
    } else if (state.ui.tab === 'calendar'){
      var cnt = state.events.filter(function(e){
        var ed = parseISO(e.date);
        return ed.getFullYear()===state.ui.calYear && ed.getMonth()===state.ui.calMonth;
      }).length;
      stat.innerHTML = '<div class="num tabular">'+cnt+'</div><div class="lbl">событий</div>';
    } else {
      var tot = useTotals() ? state.totals : null;
      var bal = tot
        ? (tot.income - tot.expense)
        : state.tx.reduce(function(s,x){ return s + (x.type==='income'? x.amount : -x.amount); },0);
      stat.innerHTML = '<div class="num tabular">'+fmtMoney(bal)+'</div><div class="lbl">баланс</div>';
    }
  }

  /* ---------- Tabs (navigation only) ---------- */
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.ui.tab = btn.dataset.tab;
      saveUI();
      renderTabs();
      renderHeader();
    });
  });
  function renderTabs(){
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===state.ui.tab); });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id==='view-'+state.ui.tab); });
  }

  /* ================= TASKS (display + filter only) ================= */
  var taskFiltersEl = document.getElementById('taskFilters');
  var FILTERS = [ ['all','Все'], ['active','Активные'], ['done','Выполненные'] ];
  function renderTaskFilters(){
    taskFiltersEl.innerHTML = FILTERS.map(function(f){
      return '<button class="chip'+(state.ui.taskFilter===f[0]?' active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>';
    }).join('');
  }
  taskFiltersEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-filter]'); if(!b) return;
    state.ui.taskFilter = b.dataset.filter; saveUI(); renderTasks(); renderTaskFilters();
  });

  function taskSort(a,b){
    if (a.done !== b.done) return a.done ? 1 : -1;
    var pr = {high:0, med:1, low:2};
    if (pr[a.priority] !== pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return (a.due||'9999') < (b.due||'9999') ? -1 : 1;
  }
  function renderTasks(){
    var list = document.getElementById('taskList');
    var items = state.tasks.slice().sort(taskSort).filter(function(t){
      if (state.ui.taskFilter==='active') return !t.done;
      if (state.ui.taskFilter==='done') return t.done;
      return true;
    });
    if (!items.length){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Задач нет</span></div>';
      return;
    }
    var t = todayISO();
    list.innerHTML = items.map(function(task){
      var overdue = task.due && task.due < t && !task.done;
      var dueTag = task.due ? '<span class="due-tag'+(overdue?' overdue':'')+'">'+fmtShortDate(task.due)+'</span>' : '';
      return '<div class="task'+(task.done?' done':'')+'" data-id="'+task.id+'">'+
        '<button class="check" aria-label="'+(task.done?'Отметить невыполненной':'Отметить выполненной')+'"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M4 12l5 5 11-11"/></svg></button>'+
        '<div class="task-body">'+
          '<div class="task-text">'+escapeHtml(task.text)+'</div>'+
          '<div class="task-meta"><span class="prio-dot" style="background:'+PRIO[task.priority].c+'"></span><span class="prio-label">'+PRIO[task.priority].l+'</span>'+dueTag+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  document.getElementById('taskList').addEventListener('click', function(e){
    var el = e.target.closest('.task'); if(!el) return;
    var id = el.dataset.id;
    var task = state.tasks.find(function(t){return t.id===id;});
    if (!task) return;
    task.done = !task.done;
    saveUI(); haptic(task.done ? 'success' : 'light'); renderTasks(); renderHeader();
  });

  function fmtShortDate(iso){
    var d = parseISO(iso);
    return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  /* ================= CALENDAR (display + navigation only) ================= */
  function renderCalendar(){
    document.getElementById('calMonthLabel').textContent = MONTHS_NOM[state.ui.calMonth]+' '+state.ui.calYear;
    var grid = document.getElementById('calGrid');
    var first = new Date(state.ui.calYear, state.ui.calMonth, 1);
    var startOffset = (first.getDay()+6)%7;
    var start = new Date(first); start.setDate(start.getDate()-startOffset);
    var t = todayISO();
    var cells = [];
    for (var i=0;i<42;i++){
      var dt = new Date(start); dt.setDate(start.getDate()+i);
      var iso = fmtISO(dt);
      var inMonth = dt.getMonth()===state.ui.calMonth;
      var hasEv = state.events.some(function(e){return e.date===iso;});
      var cls = 'cal-day'+(inMonth?'':' out')+(iso===t?' today':'')+(iso===state.ui.selectedDay?' selected':'');
      cells.push('<button class="'+cls+'" data-date="'+iso+'">'+dt.getDate()+(hasEv?'<span class="dot"></span>':'')+'</button>');
    }
    grid.innerHTML = cells.join('');
    renderDayEvents();
    renderUpcoming();
  }
  document.getElementById('calPrev').addEventListener('click', function(){ shiftMonth(-1); });
  document.getElementById('calNext').addEventListener('click', function(){ shiftMonth(1); });
  function shiftMonth(delta){
    var m = state.ui.calMonth + delta, y = state.ui.calYear;
    if (m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
    state.ui.calMonth = m; state.ui.calYear = y;
    saveUI(); renderCalendar(); renderHeader();
  }
  document.getElementById('calGrid').addEventListener('click', function(e){
    var b = e.target.closest('[data-date]'); if(!b) return;
    state.ui.selectedDay = b.dataset.date;
    var dt = parseISO(b.dataset.date);
    state.ui.calMonth = dt.getMonth(); state.ui.calYear = dt.getFullYear();
    saveUI(); renderCalendar();
  });

  function renderDayEvents(){
    var wrap = document.getElementById('dayEventsList');
    var label = document.getElementById('selectedDayLabel');
    var d = parseISO(state.ui.selectedDay);
    label.textContent = d.getDate()+' '+MONTHS[d.getMonth()]+', '+WEEKDAYS_FULL[d.getDay()];
    var evs = state.events.filter(function(e){return e.date===state.ui.selectedDay;})
      .sort(function(a,b){ return (a.time||'99:99') < (b.time||'99:99') ? -1:1; });
    if (!evs.length){
      wrap.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>На этот день событий нет</span></div>';
      return;
    }
    wrap.innerHTML = evs.map(function(ev){
      return '<div class="event-item">'+
        '<div class="event-time">'+(ev.time||'—')+'</div>'+
        '<div class="event-body"><div class="event-title">'+escapeHtml(ev.title)+'</div>'+(ev.notes?'<div class="event-notes">'+escapeHtml(ev.notes)+'</div>':'')+'</div>'+
      '</div>';
    }).join('');
  }

  function renderUpcoming(){
    var wrap = document.getElementById('upcomingList');
    var t = todayISO();
    var evs = state.events.filter(function(e){ return e.date>=t; })
      .sort(function(a,b){ return (a.date+ (a.time||'99:99')) < (b.date+(b.time||'99:99')) ? -1:1; })
      .slice(0,5);
    if (!evs.length){ wrap.innerHTML = '<div class="empty" style="padding:18px 4px;"><span>Ближайших событий нет</span></div>'; return; }
    wrap.innerHTML = evs.map(function(ev){
      var d = parseISO(ev.date);
      return '<div class="upcoming-item" data-date="'+ev.date+'">'+
        '<div class="upcoming-date"><b>'+d.getDate()+'</b>'+MONTHS[d.getMonth()].slice(0,3)+'</div>'+
        '<div class="event-body"><div class="event-title">'+escapeHtml(ev.title)+'</div><div class="event-notes">'+(ev.time?ev.time+' · ':'')+WEEKDAYS_FULL[d.getDay()]+'</div></div>'+
      '</div>';
    }).join('');
  }
  document.getElementById('upcomingList').addEventListener('click', function(e){
    var b = e.target.closest('[data-date]'); if(!b) return;
    state.ui.selectedDay = b.dataset.date;
    var dt = parseISO(b.dataset.date);
    state.ui.calMonth = dt.getMonth(); state.ui.calYear = dt.getFullYear();
    saveUI(); renderCalendar();
  });

  /* ================= FINANCE (display + period filter only) ================= */
  var FIN_PERIODS = [ ['week','Неделя'], ['month','Месяц'], ['year','Год'], ['all','Всё время'] ];
  var finPeriodsEl = document.getElementById('finPeriods');
  var finLabelEl   = document.getElementById('finLabel');
  function renderFinPeriods(){
    finPeriodsEl.innerHTML = FIN_PERIODS.map(function(p){
      return '<button class="chip'+(state.ui.finPeriod===p[0]?' active':'')+'" data-period="'+p[0]+'">'+p[1]+'</button>';
    }).join('');
  }
  finPeriodsEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-period]'); if(!b) return;
    state.ui.finPeriod = b.dataset.period; saveUI(); renderFinPeriods(); renderFinance();
  });

  function periodStart(){
    var d = new Date();
    if (state.ui.finPeriod==='week'){ d.setDate(d.getDate()-7); }
    else if (state.ui.finPeriod==='month'){ d.setDate(d.getDate()-30); }
    else if (state.ui.finPeriod==='year'){ d.setDate(d.getDate()-365); }
    else return null;
    return fmtISO(d);
  }
  function filteredTx(){
    var start = periodStart();
    return state.tx.filter(function(x){ return !start || x.date>=start; });
  }

  function renderFinance(){
    var totals = useTotals() ? state.totals : null;
    var items  = totals ? [] : filteredTx();
    var income, expense;

    if (totals){
      /* режим «Свод»: готовые итоги, фильтровать по периодам нечего */
      finPeriodsEl.style.display = 'none';
      if (finLabelEl){
        finLabelEl.style.display = '';
        finLabelEl.textContent = totals.label ? 'Итоги · ' + totals.label : 'Итоги';
      }
      income  = totals.income;
      expense = totals.expense;
    } else {
      finPeriodsEl.style.display = '';
      if (finLabelEl) finLabelEl.style.display = 'none';
      income  = items.filter(function(x){return x.type==='income';}).reduce(function(s,x){return s+x.amount;},0);
      expense = items.filter(function(x){return x.type==='expense';}).reduce(function(s,x){return s+x.amount;},0);
    }

    document.getElementById('statIncome').textContent = fmtMoney(income);
    document.getElementById('statExpense').textContent = fmtMoney(expense);
    document.getElementById('statBalance').textContent = fmtMoney(income-expense);

    var byCat = {};
    items.filter(function(x){return x.type==='expense';}).forEach(function(x){ byCat[x.category]=(byCat[x.category]||0)+x.amount; });
    var catArr = Object.keys(byCat).map(function(k){return {cat:k, amt:byCat[k]};}).sort(function(a,b){return b.amt-a.amt;});
    var maxAmt = catArr.length ? catArr[0].amt : 1;
    var barsEl = document.getElementById('catBars');
    var breakdownWrap = document.getElementById('breakdownWrap');
    if (!catArr.length){
      breakdownWrap.style.display = 'none';
    } else {
      breakdownWrap.style.display = '';
      barsEl.innerHTML = catArr.map(function(c){
        var pct = Math.round((c.amt/maxAmt)*100);
        return '<div class="bar-row"><div class="bar-top"><b>'+c.cat+'</b><span class="amt tabular">'+fmtMoney(c.amt)+'</span></div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
      }).join('');
    }

    var listEl   = document.getElementById('txList');
    var txWrapEl = document.getElementById('txWrap');
    if (totals){
      /* в Своде нет отдельных операций — прячем блок целиком */
      if (txWrapEl) txWrapEl.style.display = 'none';
      return;
    }
    if (txWrapEl) txWrapEl.style.display = '';
    var sorted = items.slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    if (!sorted.length){
      listEl.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg><span>Операций нет</span></div>';
      return;
    }
    var html = ''; var lastDate = null;
    sorted.forEach(function(x){
      if (x.date !== lastDate){
        lastDate = x.date;
        var d = parseISO(x.date);
        html += '<div class="tx-group-label">'+d.getDate()+' '+MONTHS[d.getMonth()]+(x.date===todayISO()?' · сегодня':'')+'</div>';
      }
      html += '<div class="tx-item">'+
        '<div class="tx-badge '+x.type+'">'+x.category.slice(0,1)+'</div>'+
        '<div class="tx-body"><div class="tx-cat">'+x.category+'</div>'+(x.note?'<div class="tx-note">'+escapeHtml(x.note)+'</div>':'')+'</div>'+
        '<div class="tx-amt '+x.type+' tabular">'+(x.type==='income'?'+':'−')+Math.abs(x.amount).toLocaleString('ru-RU')+' смн.</div>'+
      '</div>';
    });
    listEl.innerHTML = html;
  }

  /* ================= СИНХРОНИЗАЦИЯ: n8n -> мини-приложение ================= */
  var syncDot    = document.getElementById('syncDot');
  var syncTxt    = document.getElementById('syncTxt');
  var refreshBtn = document.getElementById('refreshBtn');
  var syncing    = false;

  function setSync(cls, text){
    if (syncDot) syncDot.className = 'sync-dot' + (cls ? ' ' + cls : '');
    if (syncTxt) syncTxt.textContent = text;
    if (refreshBtn) refreshBtn.classList.toggle('spin', cls === 'load');
  }
  function hhmm(ts){
    var d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function arr(v){ return Array.isArray(v) ? v : []; }

  /* Сервер может ошибаться — приводим всё к формату, который ждёт UI */
  function normalize(d){
    return {
      tasks: arr(d.tasks).map(function(t){
        return {
          id:       String(t.id || uid()),
          text:     String(t.text || t.title || '').trim(),
          done:     !!t.done,
          priority: (t.priority === 'high' || t.priority === 'low') ? t.priority : 'med',
          due:      (t.due && isDate(String(t.due).slice(0,10))) ? String(t.due).slice(0,10) : null
        };
      }).filter(function(t){ return t.text; }),

      events: arr(d.events).map(function(e){
        return {
          id:    String(e.id || uid()),
          title: String(e.title || e.summary || '').trim(),
          date:  String(e.date || '').slice(0,10),
          time:  e.time ? String(e.time).slice(0,5) : '',
          notes: String(e.notes || '')
        };
      }).filter(function(e){ return e.title && isDate(e.date); }),

      tx: arr(d.tx).map(function(x){
        return {
          id:       String(x.id || uid()),
          type:     x.type === 'income' ? 'income' : 'expense',
          amount:   Math.abs(Number(x.amount) || 0),
          category: String(x.category || 'Прочее').trim() || 'Прочее',
          date:     String(x.date || '').slice(0,10),
          note:     String(x.note || '')
        };
      }).filter(function(x){ return x.amount > 0 && isDate(x.date); }),

      totals: (d.totals && typeof d.totals === 'object') ? {
        label:   String(d.totals.label || ''),
        income:  Math.abs(Number(d.totals.income)  || 0),
        expense: Math.abs(Number(d.totals.expense) || 0)
      } : null
    };
  }

  function sync(manual){
    if (!API_URL){ setSync('', 'демо-режим'); return; }
    if (syncing) return;
    syncing = true;
    setSync('load', 'обновление…');

    var done = function(){ syncing = false; };

    fetch(API_URL, {
      method:  'POST',
      cache:   'no-store',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        token:    API_TOKEN,
        initData: (tg && tg.initData) ? tg.initData : ''
      })
    })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      if (Array.isArray(d)) d = d[0] || {};
      if (!d || typeof d !== 'object') throw new Error('bad payload');
      if (d.error) throw new Error(String(d.error));

      var n = normalize(d);
      state.tasks  = n.tasks;
      state.events = n.events;
      state.tx     = n.tx;
      state.totals = n.totals;
      state.syncedAt = Date.now();
      saveUI();
      renderAll();
      setSync('ok', 'обновлено ' + hhmm(state.syncedAt));
      if (manual) haptic('success');
      done();
    })
    .catch(function(err){
      setSync('err', state.syncedAt
        ? 'данные от ' + hhmm(state.syncedAt)
        : 'нет связи');
      if (manual) haptic('error');
      if (window.console) console.warn('[Ритм] sync failed:', err);
      done();
    });
  }

  if (refreshBtn) refreshBtn.addEventListener('click', function(){ haptic('light'); sync(true); });

  /* обновляем, когда пользователь возвращается в приложение */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) sync(false);
  });
  /* и фоново, пока приложение открыто */
  setInterval(function(){
    if (!document.hidden) sync(false);
  }, Math.max(15, Number(CFG.autoRefreshSec) || 60) * 1000);

  /* ---------- init ---------- */
  function renderAll(){
    renderHeader();
    renderTabs();
    renderTaskFilters();
    renderTasks();
    renderCalendar();
    renderFinPeriods();
    renderFinance();
  }
  renderAll();
  sync(false);
})();
</script>
